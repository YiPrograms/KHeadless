name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yiprograms/kheadless

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify version
        shell: bash
        run: |
          project_version="$(sed -n 's/^project(KHeadless VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          test "${GITHUB_REF_NAME#v}" = "$project_version"

      - name: Create source archive and checksum
        run: |
          mkdir -p dist
          tools/make-source-archive "${GITHUB_REF_NAME#v}" dist
          sha256sum "dist/KHeadless-${GITHUB_REF_NAME#v}.tar.gz" \
            > "dist/KHeadless-${GITHUB_REF_NAME#v}.tar.gz.sha256"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish coordinator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Containerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/KHeadless-*.tar.gz \
            dist/KHeadless-*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "KHeadless $GITHUB_REF_NAME"
